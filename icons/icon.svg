<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2436"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#cc0014"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0033cc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Tile Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#242f45" stroke-width="4"/>

  <!-- Light Halves / Beacon Flares -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Red Left Wing -->
    <path d="M 256,40 L 80,120 L 80,260 C 80,370 256,470 256,470 L 256,40 Z" fill="url(#redGrad)" filter="url(#glow)"/>
    <!-- Blue Right Wing -->
    <path d="M 256,40 L 432,120 L 432,260 C 432,370 256,470 256,470 L 256,40 Z" fill="url(#blueGrad)" filter="url(#glow)"/>

    <!-- Center Divide -->
    <line x1="256" y1="40" x2="256" y2="470" stroke="#0a0d14" stroke-width="12" stroke-linecap="round"/>

    <!-- High-Contrast Walking Pedestrian Icon -->
    <g fill="#ffffff" transform="translate(180, 150) scale(1.3)">
      <!-- Head -->
      <circle cx="58" cy="22" r="14"/>
      <!-- Body & Limbs -->
      <path d="M 64,44 L 52,44 C 43,44 36,51 36,60 L 36,88 L 48,88 L 48,136 L 62,136 L 62,94 L 74,136 L 88,136 L 76,78 L 84,66 C 88,60 84,52 76,46 Z"/>
      <!-- Walking Stride Foot -->
      <path d="M 32,88 L 20,114 L 30,118 L 42,94 Z"/>
    </g>
  </g>
</svg>
